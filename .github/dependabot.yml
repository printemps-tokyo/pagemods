version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # @types/node stays on the oldest Node line the tool supports, so a
      # newer Node API fails the typecheck instead of failing at run time.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs are toolchain names (stable, or an MSRV), not action versions.
      - dependency-name: "dtolnay/rust-toolchain"
