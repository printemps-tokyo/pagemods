name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke test: the built extension has to contain what the manifest points at.
      - name: Verify the built extension
        run: |
          test -f dist/manifest.json
          test -f dist/src/background.js
          test -f dist/src/content/loader.js
          test -f dist/src/content/main.js
          test -f dist/icons/icon128.png

  # The built extension in a real Chromium (e2e/). Playwright's Chromium
  # build is used because branded Chrome no longer loads unpacked extensions
  # from the command line.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
