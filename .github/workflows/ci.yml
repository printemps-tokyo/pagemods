name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke test: the built extension has to contain what the manifest points at.
      - name: Verify the built extension
        run: |
          test -f dist/manifest.json
          test -f dist/src/background.js
          test -f dist/src/content/loader.js
          test -f dist/src/content/main.js
          test -f dist/icons/icon128.png
